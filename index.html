it does not establish production impact or assessed job readiness.","CC BY 4.0 content, MIT code, Python, Docker"],"details":["Two editable 181-slide decks, plus workbooks, worked examples, self-checks, templates and capstone materials.","A guided Python lab with synthetic data, tests and human override flows.","An offline learning package and public web delivery.","Validated for media decoding, captions, browser playback, PDF layouts, slide structure, package integrity and lab behavior."],"boundary":"Boundary. teaches delivery methodology and judgment; the lab uses deterministic rules and synthetic exercises, so it does not establish production impact or assessed job readiness.","links":[{"label":"Open the course","url":"https://albanc80.github.io/fde-delivery-framework/"},{"label":"Repository","url":"https://github.com/albanc80/fde-delivery-framework"}]},{"title":"Agentic Real-Time Operations Center for the well lifecycle","stage":"Advisory platform + 17-agent MVP Operational AI, multi-agent, human oversight","description":"Two builds on one architecture: a shadow-mode drilling advisory platform where data quality and physical limits act as gates, and a 17-agent program that monitors wells across the full lifecycle — from well control and steering to cementing, completions and production — on a WITSML simulator. Engineers stay on the loop within hard safety boundaries; the first field pilot is Drilling Ahead in advisory mode, with no rig-control writes.","paragraphs":["Why it matters, turns operational ambition into a bounded engineering program. Advisory capability stays separate from autonomous control, and standards support is treated as an integration requirement to verify, not assume.","Boundary. validated on a WITSML simulator, not a live rig; Kubernetes manifests are authored but not deployed, and SSO and multi-rig support are deferred to V2."],"details":["Advisory platform: a deterministic data-quality and admissibility path, architecturally separate from the reasoning path, qualifies every channel before it can influence a recommendation. Hard physics violations and unresolved redundancy fail closed, and no LLM sits in that path.","Authored the domain rule set: 56 monitoring channels, 57 constraints across 10 categories (well control, well killing, BOP integrity, casing design, pressure, tripping and more) and 50 SOP rules covering MASP/MAASP, kick tolerance, trip margin, shut-in procedures, well-killing method selection, H₂S management and abandonment.","Operator console with HITL/HOTL approval flows, agent workflow visibility, full trace logs, replay and WITSML/ETP connectivity validation, all data sources read-only. 62 Python files / 10,802 lines, with safety configuration validated inside the running container.","Built the full 17-agent collective across MVP phases 0–5 and two follow-on releases: a 1 Hz orchestration loop with four-step negotiation, locks, a state machine and formal phase handoffs.","Safety and physics layer: operating envelope, formula library (API 5C3, CBL, Arps) and an autonomy manager that demotes an agent to Level 1 after a hard envelope violation.","Data layer with a quality engine, message bus and TimescaleDB, buffered replay on database outage, and a freeze on autonomous execution after a 30-second data-feed gap.","Human-on-the-loop console with live telemetry, approval queue, escalations, multi-track log plots, 3D trajectory and fleet GIS view, over a REST/WebSocket API with JWT and role-based access.","Defined requirements for legacy and newer WITSML/ETP sources, including discovery and manual mapping of provider-specific variables, plus an Azure-focused edge and cloud deployment direction.","Verified with 179 unit and 9 integration tests in the repository and a live Docker stack run against the acceptance criteria."],"boundary":"Boundary. validated on a WITSML simulator, not a live rig; Kubernetes manifests are authored but not deployed, and SSO and multi-rig support are deferred to V2.","links":[]},{"title":"Operational data quality and decision governance","stage":"Research integration & detailed specs Trustworthy inputs, traceable decisions","description":"Specifications that connect operational data qualification with governed agent decisions, so input quality and action authority are explicit before a recommendation moves through an operational workflow.","paragraphs":["Why it matters, assess the evidence, constrain the decision, preserve accountability and make the result inspectable.","Boundary. invention-related detail is deliberately kept out of this description."],"details":["Specified data assessment across timing, freshness, completeness, drift and physical plausibility.","Connected qualified observations to operational context and downstream agent behavior.","Defined decision gates for authority, operational constraints and procedural requirements.","Addressed conflicting recommendations, human escalation, uncertainty and decision traceability.","Set requirements for versioned rules, changing human ownership and controlled updates.","Added replay, fault scenarios and shadow-mode evaluation to the development plan."],"boundary":"Boundary. invention-related detail is deliberately kept out of this description.","links":[]},{"title":"Agent Governance Engine","stage":"Implemented prototype Capability-aware risk, deterministic policy","description":"A governance service that profiles AI-agent capabilities, scores risk, activates controls and assesses proposed actions before execution. Authorization stays deterministic: explicit policy logic, not an LLM, decides whether an action is allowed.","paragraphs":["Boundary. a policy decision point only. Enforcement belongs in a separate tool adapter, gateway or sandbox, and production use needs further storage, identity, approval, audit and security work."],"details":["Agent registration and capability profiling.","Risk scoring and control selection.","Tool allowlists, rate limits and approval requirements, with dual approval for critical actions.","Capability drift detection and a kill switch.","Fail-closed handling for malformed or unassessable inputs.","21 Python modules on FastAPI with interactive OpenAPI docs, configurable thresholds, weights, tool policy and rate limits, plus a command-line interface and automated tests.","Returns an authorized execution record for a separate least-privilege enforcement point, and records policy evidence and justifications without ever requesting model chain-of-thought."],"boundary":"Boundary. a policy decision point only. Enforcement belongs in a separate tool adapter, gateway or sandbox, and production use needs further storage, identity, approval, audit and security work.","links":[]},{"title":"Drilling and well-integrity data products on the Volve dataset","stage":"Working build, live Databricks Governed data products, MCP","description":"Turned Equinor’s Volve offshore dataset and its governance tables into Databricks data products that agents and analysts can query consistently, reproduce and trace back to governed tables.","paragraphs":["Why it matters, answers the five questions that decide whether an AI can be trusted with the data."],"details":["WITSML-to-tabular extraction into Unity Catalog medallion tables, plus a drilling telemetry table spanning two catalogs.","A drilling MCP server (18 Python modules): SQL Warehouse access, log intelligence and interpretation, formation correlation, mud hydraulics, NPT analysis, well reporting, anomaly detection and benchmarking.","NPT/ILT analysis with a self-contained interactive HTML report.","Governance analytics run against live tables: bias across asset-criticality classes, criticality-to-failure risk, explainability from failure back to integrity score, silent-anomaly compliance, and predictive lead time.","Queries executed on a live SQL Warehouse with OAuth service-principal credentials; 32 commits."],"boundary":"","links":[]},{"title":"Subsurface Data MCP — governed federated access","stage":"Working build Federated data, read-only by design","description":"A production-grade .NET 10 MCP server, on the official C# SDK, giving agents governed, read-only access to WITSML servers, Landmark EDM, Databricks and OSDU through one canonical subsurface model.","paragraphs":["Boundary. development auth mode still executes authorization policies, so security paths are exercised rather than bypassed."],"details":["Hexagonal architecture: zero-dependency domain behind a source-adapter port; a federation layer with source registry, fan-out router, identity mapping, decimation and resilience; one plugin per backend.","ASP.NET Core host with MCP tools, Entra authentication, OpenTelemetry and audit.","A shared adapter-conformance suite every backend must pass.","A deterministic synthetic Volve-style source (10 wellbores, 6 curves, ~13k samples per curve) for offline demos, including degraded-source behavior.","Every functional and non-functional requirement traced into the code; an end-to-end script asserts 15 behaviors across the tool surface."],"boundary":"Boundary. development auth mode still executes authorization policies, so security paths are exercised rather than bypassed.","links":[]},{"title":"AI Engineering OS and acceptance testing","stage":"Packaged framework & evaluation assets Governed AI-assisted delivery","description":"Reusable workflows that take coding agents through requirements, architecture, implementation, review, verification and release, with the amount of process scaled to task complexity and risk. Key deliverable: an enterprise acceptance-test package for an AI-powered real-time drilling operations advisor.","paragraphs":["Why it matters, judges an AI workflow on more than code output: whether it respects constraints, exposes uncertainty, leaves traceable artifacts and verifies the requested outcome."],"details":["Realistic engineering scenario and repository skeleton.","Workflow prompts and human approval gat
