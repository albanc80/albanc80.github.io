it does not establish production impact or assessed job readiness.","CC BY 4.0 content, MIT code, Python, Docker"],"details":["Two editable 181-slide decks, plus workbooks, worked examples, self-checks, templates and capstone materials.","A guided Python lab with synthetic data, tests and human override flows.","An offline learning package and public web delivery.","Validated for media decoding, captions, browser playback, PDF layouts, slide structure, package integrity and lab behavior."],"boundary":"Boundary. teaches delivery methodology and judgment; the lab uses deterministic rules and synthetic exercises, so it does not establish production impact or assessed job readiness.","links":[{"label":"Open the course","url":"https://albanc80.github.io/fde-delivery-framework/"},{"label":"Repository","url":"https://github.com/albanc80/fde-delivery-framework"}],"intendedOutcome":"Help technical professionals practice a repeatable delivery method, from problem framing and implementation to evaluation, adoption, and reusable learning."},{"title":"Agentic Real-Time Operations Center for the well lifecycle","stage":"Advisory platform + 17-agent MVP Operational AI, multi-agent, human oversight","description":"Two builds on one architecture: a shadow-mode drilling advisory platform where data quality and physical limits act as gates, and a 17-agent program that monitors wells across the full lifecycle — from well control and steering to cementing, completions and production — on a WITSML simulator. Engineers stay on the loop within hard safety boundaries; the first field pilot is Drilling Ahead in advisory mode, with no rig-control writes.","paragraphs":["Why it matters, turns operational ambition into a bounded engineering program. Advisory capability stays separate from autonomous control, and standards support is treated as an integration requirement to verify, not assume.","Boundary. validated on a WITSML simulator, not a live rig; Kubernetes manifests are authored but not deployed, and SSO and multi-rig support are deferred to V2."],"details":["Advisory platform: a deterministic data-quality and admissibility path, architecturally separate from the reasoning path, qualifies every channel before it can influence a recommendation. Hard physics violations and unresolved redundancy fail closed, and no LLM sits in that path.","Authored the domain rule set: 56 monitoring channels, 57 constraints across 10 categories (well control, well killing, BOP integrity, casing design, pressure, tripping and more) and 50 SOP rules covering MASP/MAASP, kick tolerance, trip margin, shut-in procedures, well-killing method selection, H₂S management and abandonment.","Operator console with HITL/HOTL approval flows, agent workflow visibility, full trace logs, replay and WITSML/ETP connectivity validation, all data sources read-only. 62 Python files / 10,802 lines, with safety configuration validated inside the running container.","Built the full 17-agent collective across MVP phases 0–5 and two follow-on releases: a 1 Hz orchestration loop with four-step negotiation, locks, a state machine and formal phase handoffs.","Safety and physics layer: operating envelope, formula library (API 5C3, CBL, Arps) and an autonomy manager that demotes an agent to Level 1 after a hard envelope violation.","Data layer with a quality engine, message bus and TimescaleDB, buffered replay on database outage, and a freeze on autonomous execution after a 30-second data-feed gap.","Human-on-the-loop console with live telemetry, approval queue, escalations, multi-track log plots, 3D trajectory and fleet GIS view, over a REST/WebSocket API with JWT and role-based access.","Defined requirements for legacy and newer WITSML/ETP sources, including discovery and manual mapping of provider-specific variables, plus an Azure-focused edge and cloud deployment direction.","Verified with 179 unit and 9 integration tests in the repository and a live Docker stack run against the acceptance criteria."],"boundary":"Boundary. validated on a WITSML simulator, not a live rig; Kubernetes manifests are authored but not deployed, and SSO and multi-rig support are deferred to V2.","links":[],"intendedOutcome":"Help RT operations engineers assess conditions and review recommendations in real-time within explicit data-quality, physical, and human-approval boundaries."},{"title":"Operational data quality and decision governance","stage":"Research integration & detailed specs Trustworthy inputs, traceable decisions","description":"Specifications that connect operational data qualification with governed agent decisions, so input quality and action authority are explicit before a recommendation moves through an operational workflow.","paragraphs":["Why it matters, assess the evidence, constrain the decision, preserve accountability and make the result inspectable.","Boundary. invention-related detail is deliberately kept out of this description."],"details":["Specified data assessment across timing, freshness, completeness, drift and physical plausibility.","Connected qualified observations to operational context and downstream agent behavior.","Defined decision gates for authority, operational constraints and procedural requirements.","Addressed conflicting recommendations, human escalation, uncertainty and decision traceability.","Set requirements for versioned rules, changing human ownership and controlled updates.","Added replay, fault scenarios and shadow-mode evaluation to the development plan."],"boundary":"Boundary. invention-related detail is deliberately kept out of this description.","links":[],"intendedOutcome":"Help teams establish whether operational data is fit for use and who has authority to advance a recommendation."},{"title":"Agent Governance Engine","stage":"Implemented prototype Capability-aware risk, deterministic policy","description":"A governance service that profiles AI-agent capabilities, scores risk, activates controls and assesses proposed actions before execution. Authorization stays deterministic: explicit policy logic, not an LLM, decides whether an action is allowed.","paragraphs":["Boundary. a policy decision point only. Enforcement belongs in a separate tool adapter, gateway or sandbox, and production use needs further storage, identity, approval, audit and security work."],"details":["Agent registration and capability profiling.","Risk scoring and control selection.","Tool allowlists, rate limits and approval requirements, with dual approval for critical actions.","Capability drift detection and a kill switch.","Fail-closed handling for malformed or unassessable inputs.","21 Python modules on FastAPI with interactive OpenAPI docs, configurable thresholds, weights, tool policy and rate limits, plus a command-line interface and automated tests.","Returns an authorized execution record for a separate least-privilege enforcement point, and records policy evidence and justifications without ever requesting model chain-of-thought."],"boundary":"Boundary. a policy decision point only. Enforcement belongs in a separate tool adapter, gateway or sandbox, and production use needs further storage, identity, approval, audit and security work.","links":[],"intendedOutcome":"Help agentic teams assess proposed agent actions against explicit risk and authorization rules before a separate enforcement layer permits execution."},{"title":"Drilling and well-integrity data products on the Volve dataset","stage":"Working build, live Databricks Governed data products, MCP","description":"Turned Equinor’s Volve offshore dataset and its governance tables into Databricks data products that agents and analysts can query consistently, reproduce and trace back to governed tables.","paragraphs":["Why it matters, answers the five questions that decide whether an AI can be trusted with the data."],"details":["WITSML-to-tabular extraction into Unity Catalog medallion tables, plus a drilling telemetry table spanning two catalogs." emetry, protocols, platform components, and escalation evidence across the path from the field to consuming applications.","paragraphs":[],"details":["Eleven diagnostic skills cover observability, stream brokers, time-series queries, caches, queues, push channels, indexes, gateways, and industrial protocols.","Inspects message schemas, streaming sessions, legacy rig protocols, and OPC interfaces.","Includes guidance for failover, backfill, and root-cause reports, with attention to historical-data integrity."],"boundary":"Operational workarounds require assessment against the affected system's controls and human authority.","links":[],"intendedOutcome":"Help engineering support teams investigate real-time data faults with traceable evidence, reversible workaround options, and complete context for escalation."},{"title":"AI Enablement & Training Content Builder","stage":"Private enablement agent","description":"An instructional-design agent that turns documentation and subject-matter knowledge into practical AI training. It supports agent-building walkthroughs, demonstrations, workshops, handouts, and reusable learning materials for technical and non-technical participants.","paragraphs":[],"details":["Seven skills cover agent-builder walkthroughs, demonstrations, workshop exercises, handout formatting, brand consistency, engineering workflow, and writing.","Uses connected knowledge and collaboration tools under the signed-in user's authority.","Produces training assets; the existing portfolio's courses and workshops remain separate deliverables."],"boundary":"Training production does not itself establish learner improvement or adoption outcomes.","links":[],"intendedOutcome":"Help training teams turn current technical material into practical learning experiences that support reusable workflows, agent building, and informed adoption."},{"title":"Financial KPI MCP Server","stage":"Private tool server","description":"A seven-tool service for consistent financial KPI calculation, zone classification, period comparison, peer benchmarks, and risk-trigger summaries. It exposes one framework to finance copilots, planning agents, or executive dashboards.","paragraphs":[],"details":["Covers profitability, efficiency, liquidity, structure, cash, valuation, trend, benchmark, and risk measures.","Includes agent identity and delegation, tool-level authorization, human approval gates, timeouts, retries, and cost controls.","Uses HMAC-chained audit records, correlation identifiers, spans, and a circuit breaker for anomaly response.","Returns diagnosed nulls when required inputs are missing."],"boundary":"Calculated outputs and recommended actions require review in the relevant business context.","links":[],"intendedOutcome":"Give finance teams consistent KPI calculations and traceable risk signals so reviews can focus on exceptions, supporting evidence, and next actions."},{"title":"RFP and Tender Automation MCP Server","stage":"Private tool server","description":"A governed data-access service for tender and proposal workflows. It connects enterprise query engines, storage, documents, search, allow-listed APIs, and vector knowledge through one interface for assistants and custom agents.","paragraphs":[],"details":["Supports local standard-input/output access and hosted streamable HTTP, with Kubernetes deployment support.","Includes managed and workload identity, runtime secret retrieval, TLS, private-endpoint infrastructure, and restricted container settings.","Uses host allow-lists for outbound requests and CI checks for static analysis, dependency vulnerabilities, and image scanning.","Preserves the earlier twelve-service design as an archive while using a simpler tool-server architecture."],"boundary":"","links":[],"intendedOutcome":"Help bid teams retrieve controlled enterprise evidence through one interface, reducing manual source assembly and supporting claims that reviewers can trace."},{"title":"Downhole NPT Advisory Agent","stage":"Private advisory agent","description":"An independently runnable drilling-mechanics adviser examining mechanical specific energy, vibration and stick-slip, hydraulics and hole cleaning, and torque-and-drag trends. It organizes diagnostic evidence into prioritized advisories with the consequence of taking no action made explicit.","paragraphs":[],"details":["Distinguishes possible dysfunction from benign formation changes using four drilling-mechanics diagnostic pillars.","Focuses on wellbore and equipment protection when evaluating potential lost-time mechanisms.","Advisories retain human authority over every operational action; the agent does not actuate rig controls."],"boundary":"Advisory only; no rig-control actuation. Field prediction performance and avoided lost time are not established here.","links":[],"intendedOutcome":"Help drilling engineers interpret dysfunction indicators and prioritize advisory responses while retaining human authority, well-integrity priorities, and control of operational actions."},{"title":"Product Portfolio System of Record","stage":"Pre-production application","description":"A personal product-portfolio workspace linking strategy, discovery, delivery, and governance. It brings component architecture, data domains, ownership, roadmap items, migration status, and open gaps into one navigable record.","paragraphs":["A separate .NET/PostgreSQL build from APLM, which focuses on bringing product teams together."],"details":["Converts a framework/manual, migration playbook, and product workbook into a linked web application.","Uses a .NET 8 modular monolith, a single-page frontend, PostgreSQL, workbook import, and enforced dependency rules.","Includes a gap scanner, consistency linter, role-based access, health checks, and distributed tracing.","Containerized behind a same-origin reverse proxy, with an explicit pending-review list."],"boundary":"Pre-production; the pending-review list remains part of its readiness assessment.","links":[],"intendedOutcome":"Help an individual product leader keep ownership, component dependencies, migration work, and open decisions visible in a linked record for personal planning."},{"title":"OT Security Topology Advisor","stage":"Simulation-tested prototype","description":"A five-agent OT topology and segmentation adviser tested on simulated scenarios. It links topology, network architecture, cyber review, simulation, and execution routing through validated contracts and an auditable decision trail.","paragraphs":[],"details":["Validates each routed payload against a registered schema and records transitions with a correlation identifier.","Cyber review can override a network proposal; simulation gates subsequent routing.","Uses standard-library implementation without third-party dependencies or a build step, and includes 19 self-checks.","Includes connector allowlisting and rollback in the described execution design.","Low-risk steps can proceed automatically within the simulated workflow.","Every non-low-risk case is flagged and routed for human approval before any permitted action.","High-risk requests remain rejected under the documented policy; human approval does not bypass hard rejection rules."],"boundary":"Tested on simulated OT scenarios only; live-system execution and production readiness have not been validated.","links":[],"intendedOutcome":"Help OT teams assess segmentation proposals and simulated impact, with non-low-risk cases flagged for human approval before any permitted action."}]`),Ew=[{title:"AI & agents",items:["Agentic AI","LLM applications","MCP servers","Copilot declarative agents","Prompt engineering","Guardrails & governance","Model evaluation","AI-SDLC","Multi-agent orchestration","Deterministic policy & HITL design","LangGraph","MCP in Python & .NET","Qdrant, Redis memory","Local + hosted model routing","Golden datasets"]},{title:"Data & integration",items:["WITSML 1.4.1 / 2.1","ETP","OPC UA","API integration","Real-time pipelines","Data quality","Databricks","Edge vs cloud architecture","ETP 1.1 / 1.2","Unity Catalog medallion","dbt","OSDU","Landmark EDM","TimescaleDB","NPT analytics"]},{title:"Code & platforms",items:["Python","SQL","JavaScript / TypeScript","Azure","AWS","Azure AI Foundry","Azure DevOps","GitHub, CI/CD","C# / .NET 8–10","FastAPI, Pydantic v2","Node / Express","Docker Compose","OpenTelemetry","ruff, mypy, pytest"]},{title:"Customer delivery",items:["Solution architecture","Requirements discovery","Onboarding & adoption","Technical training","SLAs & XLAs","Executive communication","Training & workshop design","Bilingual EN/ES writing"]},{title:"Governance & assurance",items:["3-tier HITL design","Asset criticality classification","Physical verification protocols","4-gate agent onboarding","Audit & WORM schemas","Red-teaming","ISO/IEC 42001","NIST AI RMF","DAMA-DMBOK","OWASP LLM & Agentic AI"]},{title:"Product & front-end",items:["React 18 + TypeScript + Vite","Tailwind v4","Tablet-first UX","Offline-first state","i18next bilingual apps","Expo / React Native","Single-file web apps","Data visualization"]}],ww=[{title:"Product strategy & execution",description:"I turn customer needs and operational constraints into roadmaps, requirements, and delivery priorities, connecting technical decisions with product value and adoption."},{title:"Agentic AI & governance",description:"I build agent workflows, reusable AI skills, and delivery guardrails. I work across engineering, security, legal, and operations to define what agents can access, propose, and execute."},{title:"Real-time data & integration",description:"I connect fragmented enterprise systems, improve data quality, and translate real-time workflows into product requirements. My experience spans standards-based integration and remote operations."},{title:"Customer & commercial judgment",description:"I connect technical capability with customer value through discovery, solution design, enterprise proposals, and service agreements. I use customer feedback and service performance to inform product decisions."},{title:"Global delivery & adoption",description:"I build delivery and customer success practices around onboarding, training, service quality, and ongoing feedback. I connect product teams and distributed operations so new workflows hold up in use."}],As={projects:Aw,capabilities:Ew,experienceHighlights:ww},Tw={0:{decision:"Pair the delivery lifecycle with a synthetic, deterministic lab and human override flows.",sections:[["Context & target user","Technical professionals entering forward-deployed delivery and learning to connect discovery, implementation, evaluation, and adoption."],["Contribution","Designed and produced the English and Spanish course, editable decks, workbooks, guided Python lab, and reusable delivery templates."],["Decision & trade-off","Use synthetic data and deterministic lab rules so learners can inspect behavior and practice human override. This improves reproducibility while limiting what the lab can establish about production AI."],["Recorded evidence","Recorded checks cover for media decoding, captions, browser playback, document layout, package integrity, and lab behavior. Course and repository links are public."],["Results & limits","The learning package is released. Learner improvement, job readiness, and downstream business impact have not been established by the recorded project evidence."]]},3:{decision:"Separate agent reasoning from deterministic authorization and least-privilege enforcement.",sections:[["Context & target user","Teams coordinating tool-using agents and needing explicit action authority, risk controls, and human approval requirements."],["Contribution","Built a policy-decision prototype with capability profiling, risk scoring, control selection, allowlists, rate limits, approval requirements, drift detection, and a kill switch."],["Decision & trade-off","Keep authorization in explicit policy logic rather than an LLM. A separate adapter, gateway, or sandbox must enforce the decision; separating the responsibilities makes the boundary inspectable but adds integration work."],["Recorded evidence","The prototype includes a FastAPI prototype, configurable policy controls, a command-line interface, and automated tests. A walkthrough is available on request."],["Results & limits","This is a policy decision point, not a production enforcement platform. Further identity, approval, storage, audit, and security work is required. No production deployment or end-to-end enforcement is established by the recorded evidence."]]},6:{decision:"Evaluate the delivery workflow against constraints and adversarial cases, not code output alone.",sections:[["Context & target user","Engineering teams using coding agents for enterprise delivery, where traceability, review, and verification affect whether a result is usable."],["Contribution","Created reusable engineering workflows, an acceptance-test package, synthetic fixtures, seeded implementation traps, and reviewer criteria."],["Decision & trade-off","Scale process to task complexity and risk, with independent review and approval gates. The trade-off is more explicit verification work in exchange for inspectable delivery evidence."],["Recorded evidence","Recorded package validation includes: 25 required files, 11 trap checks, and 41 ZIP entries. The public repository exposes the framework for inspection."],["Results & limits","Package checks demonstrate completeness of the recorded artifacts. They do not establish production adoption, agent accuracy, or measured cost and latency."]]},18:{decision:"Keep specialist mandates narrow, with four human approval gates and assurance scaled to engagement risk.",sections:[["Context & target user","Teams taking AI work from an ambiguous business request to an owned, verifiable delivery outcome, including adoption and operational handover."],["Contribution","Designed and configured one orchestrator and six specialist agents, supported b
